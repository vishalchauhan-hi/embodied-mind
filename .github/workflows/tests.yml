name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # ubuntu-24.04: the newest image with a prebuilt Python 3.9 (MineDojo's version)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests (offline, no Minecraft or API key)
        run: pytest -q
      - name: End-to-end smoke run on the mock environment
        run: python -m embodied_mind.evaluate --env mock --model rule --task_suite all --num_episodes 2 --output_dir /tmp/smoke
